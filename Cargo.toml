[package]
name = "mcp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "stdio"
path = "src/bin/stdio.rs"

[[bin]]
name = "streamable"
path = "src/bin/streamhttp.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
chrono = "0.4"
openid = "0.23.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
rmcp = { version = "3.1.4", features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-std", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "std",
    "fmt",
] }
trustify-auth = { git = "https://github.com/guacsec/trustify.git", tag = "v0.5.0"}
trustify-module-fundamental = { git = "https://github.com/guacsec/trustify.git", tag = "v0.5.0"}
urlencoding = "2.1"

[dev-dependencies]
log = "0.4"
rmcp = { version = "3.1.4", features = ["client", "transport-child-process"] }
test-log = "0.2.18"
trustify-test-context = { git = "https://github.com/guacsec/trustify.git", tag = "v0.5.0"}

[patch.crates-io]
# Trustify v0.5.0 patches csaf to use packageurl 0.6 (crates.io csaf uses 0.3, causing a conflict).
# Cargo [patch] sections don't propagate to downstream consumers, so we must replicate it here.
# Pinned to the exact commit used in trustify v0.5.0's Cargo.lock.
csaf = { git = "https://github.com/scm-rs/csaf-rs", rev = "63ac9e19d881cbf1808de38b6849635cda19931d" }
